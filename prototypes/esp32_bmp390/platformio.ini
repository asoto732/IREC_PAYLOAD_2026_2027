; ESP32 + BMP390 logger
;   Build:   check mark on the bottom bar   (pio run)
;   Upload:  right arrow                    (pio run -t upload)
;   Monitor: plug icon                      (pio device monitor)

[env:esp32]
platform = espressif32
board = esp32dev                     ; generic ESP32, fits the Freenove WROVER
framework = arduino
board_build.filesystem = littlefs    ; flash filesystem for log.txt
monitor_speed = 115200               ; must match Serial.begin()
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit BMP3XX Library @ ^2.1.6
