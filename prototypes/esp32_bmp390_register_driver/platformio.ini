; BMP390 on a Freenove ESP32 WROVER
;
;   pio run -e esp32 -t upload     build and flash the board
;   pio device monitor             watch the CSV output
;   pio test -e native             run the math and driver tests on a laptop

[platformio]
default_envs = esp32

[env]
build_flags = -Wall -Wextra

; esp32dev is the generic ESP32 target and runs on the Freenove WROVER.
; PSRAM is not needed for this project.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Host tests: builds only lib/ (no Arduino), so it runs with no board attached.
; Needs a C++ compiler on the laptop (g++/MinGW on Windows).
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=c++17
