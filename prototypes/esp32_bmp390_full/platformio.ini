; ESP32 + BMP390 logger (requirements: REQUIREMENTS.md)
;
;   pio run -t upload        build and flash
;   pio device monitor       serial monitor (type l, d, e, x)

[env:esp32]
platform = espressif32
board = esp32dev                     ; E32F-1: runs on the Freenove ESP32 WROVER
framework = arduino
board_build.filesystem = littlefs    ; E32F-4
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit BMP3XX Library @ ^2.1.6   ; E32F-3

; Uncomment to save everything the monitor prints to a file under logs/.
; Handy for keeping a file dump (E32F-27) without copy and paste.
; monitor_filters = default, log2file
